services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port is configurable so the container can avoid a native PostgreSQL
      # already bound to 5432 (e.g. POSTGRES_HOST_PORT=5433 on this machine).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_report"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rag_report_postgres:/var/lib/postgresql/data

volumes:
  rag_report_postgres:
